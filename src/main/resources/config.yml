enable_scheduler: true
event_interval_hours: 2.0
join_duration_seconds: 60
min_players: 2
max_players: 0
allowed_worlds: []
authorization_ticks: 40
game_timeout_minutes: 30
direct_start_confirmation_timeout_seconds: 10
direct_start_poll_ticks: 2
direct_start_timeout_seconds: 10
join_stagger_ticks: 1
players_per_join_tick: 64
# Extra ticks after the countdown hits 0 before entry actually closes. Lets a
# last-second /event join finish snapshotting inventory before arena send.
join_close_grace_ticks: 5
arena_ready_timeout_seconds: 60
arena_ready_poll_ticks: 10
# /event donorstart — lets donors open an event themselves.
# Refused while an event is already running (join phase included).
donor_start:
  enabled: true
  # Permission a player needs. LuckPerms grants group.<name> to everyone in that group,
  # so "group.sun" means anyone in the sun group. cosmicevents.admin always passes.
  permission: "group.sun"
  # Hours a player waits between uses. 0 disables the cooldown.
  # Timestamps live in donor_cooldowns.yml, so cooldowns survive restarts.
  cooldown_hours: 24
  # Join phase length in seconds. 0 uses join_duration_seconds above.
  join_duration_seconds: 0
  # Put the player who ran the command straight into the event.
  auto_join: true
blocked_commands:
  - "ba"
  - "bluearcade"
  - "arcade"
allowed_commands_during_game:
  - "event"
  - "events"
  - "msg"
  - "tell"
  - "r"
  - "w"
# Applied during join phase and arena wait. Donor /speed /jump stay blocked.
# Minigame speed and jump boost still apply after the round actually starts.
broadcast_votes_to_participants: true
placeholders:
  time_hours_format: "{hours}h {minutes}m {seconds}s"
  time_minutes_format: "{minutes}m {seconds}s"
  time_seconds_format: "{seconds}s"
  joining_format: "&aJoining ({time}s)"
  active_format: "&cActive"
  idle_starting_soon: "Starting soon..."
  # Per-player (works offline / for LB plugins): %cosmicevents_wins% or %autoevent_wins%
join_command: "ba join {arena}"
leave_command: "ba leave confirm"
# Snapshot inventories at /event join, before BlueArcade. Restored on leave, kick,
# disconnect, and next login. Files live in plugins/CosmicEvents/inventories/.
# Live items stay until BlueArcade has joined (so BA snapshots the real inventory),
# then they are stripped so survival items cannot leak into the minigame.
restore_inventory: true
# Join origin (world, gamemode, potion effects, walk/fly speed) is always saved so
# a disconnect or restart cannot dump players into the overworld with leftover
# minigame speed/jump boost. Files live in plugins/CosmicEvents/origins/.
# Runs once all event players are in the arena (before the game starts).
# Commands with {player}/{uuid} (or %player%/%uuid%) run once per player as console.
# Commands without those placeholders run once globally.
# Other placeholders: {arena}, {game}
post_join_console_commands: []
post_join_player_commands: []
arenas:
  - "1"
minigames:
  - "all_against_all"
  - "block_party"
  - "bridge_race"
  - "chairs"
  - "exploding_sheep"
  - "fast_zone"
  - "knockback"
  - "minefield"
  - "one_in_the_chamber"
  - "race"
  - "red_alert"
  - "run_from_the_beast"
  - "snowball_fight"
  - "spleef"
  - "splegg"
  - "tnt_run"
  - "tnt_tag"
  - "traffic_light"
  - "water_well"
