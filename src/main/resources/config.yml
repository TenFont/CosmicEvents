# Placement rewards (1st / 2nd / 3rd). Item is optional when using commands only.
# commands run as console by default. Prefix with "player:" to run as the player.
# "commands" may be a list or a single string; the old "command:" key still works.
# Plain-text tellraw is converted to JSON for you, e.g. "tellraw {player} &aYou won!".
# Placeholders: {player}, {uuid}, {position}. message also accepts {amount}, {item}.
# Failed or unknown commands are reported in the console log.
rewards:
  enabled: true
  first:
    item:
      material: "GOLD_INGOT"
      amount: 3
      name: "&6&lEvent Ticket 1st"
      lore:
        - "&7Awarded for first place"
    # message: "&aYou won and received {amount}x {item}&a!"
    # Example commands:
    #   - "tellraw {player} &aYou won!"
    #   - "lp user {player} permission set example.reward true"
    #   - "player: warp spawn"
    commands: []
  second:
    item:
      material: "IRON_INGOT"
      amount: 2
      name: "&f&lEvent Ticket 2nd"
      lore:
        - "&7Awarded for second place"
    commands: []
  third:
    item:
      material: "COPPER_INGOT"
      amount: 1
      name: "&c&lEvent Ticket 3rd"
      lore:
        - "&7Awarded for third place"
    commands: []
